[project]
name = "hermes-openclaw-adapter"
version = "0.1.0"
description = "Hermes → Adapter → OpenClaw MVP starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "python-dotenv==1.0.1",
  "jinja2==3.1.4",
  "python-multipart==0.0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
filterwarnings = ["error::DeprecationWarning"]
markers = [
  "contract: executable schemas, builders, board, queue, and safety contracts",
  "governance: repository policy, documentation, preflight, and trust guards",
  "legacy: frozen or compatibility-layer behavior",
  "fuzz: deterministic mutation and malformed-input suites",
  "slow: intentionally expensive tests; excluded by default and included by the documented full-suite command",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "app/blackboard_validators.py",
  "app/approval_packet_builder.py",
  "app/evidence_bundle_builder.py",
  "app/remote_readonly_projection.py",
  "app/hash_chain.py",
  "app/rollback_preview_builder.py",
  "app/phase9_token.py",
  "app/phase9_presence.py",
  "app/phase9_abort.py",
  "app/phase9_gate.py",
  "app/phase9_burn_ledger.py",
  "app/phase9_burn_evidence.py",
  "app/phase9_audit_chain_writer.py",
  "app/phase9_openclaw_executor.py",
  "app/phase9_presence_channel.py",
  "app/phase9_preflight.py",
  "app/phase9_token_issuer.py",
  "scripts/check_phase9_oob_wiring.py",
  "scripts/run_phase9_n1.py",
]
